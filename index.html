<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>The Quiet Corner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Quiet Corner">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Karla:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #17101f;
  --bg-elevated: #221830;
  --bg-card: #2a1e3b;
  --hairline: rgba(242,232,213,0.10);
  --gold: #c9a15a;
  --gold-soft: rgba(201,161,90,0.18);
  --rose: #a8455a;
  --rose-soft: rgba(168,69,90,0.22);
  --emerald: #5c9484;
  --emerald-soft: rgba(92,148,132,0.20);
  --parchment: #f2e8d5;
  --lavender: #b3a3c4;
  --lavender-dim: #8577a0;
  --radius: 10px;
  --shadow: 0 14px 34px rgba(8,5,16,0.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 12% -8%, rgba(168,69,90,0.14), transparent 60%),
    radial-gradient(ellipse 800px 600px at 100% 0%, rgba(201,161,90,0.09), transparent 55%),
    var(--bg);
  color: var(--parchment);
  font-family: 'Karla', sans-serif;
  min-height: 100vh;
}
::selection{ background: var(--gold-soft); }
.wrap{ max-width: 1080px; margin: 0 auto; padding: 28px 20px 90px; }

/* ---- Header ---- */
.eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color: var(--gold); margin: 0 0 6px 2px; font-weight:700; }
h1.title{ font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic; font-size: 42px; line-height:1.05; margin: 0 0 20px 0; }
h1.title em{ color: var(--rose); font-style:italic; }

.stats-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 18px; }
.stat-pill{ background: var(--bg-elevated); border:1px solid var(--hairline); border-radius: 999px; padding: 9px 16px; display:flex; align-items:baseline; gap:7px; }
.stat-pill b{ font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--gold); font-weight:700; }
.stat-pill span{ font-size:11.5px; color: var(--lavender); }

.genre-bars{ display:flex; flex-direction:column; gap:7px; margin-bottom: 26px; }
.gbar-row{ display:flex; align-items:center; gap:10px; font-size:12px; }
.gbar-label{ width:110px; flex:none; color:var(--lavender); text-align:right; }
.gbar-track{ flex:1; height:9px; background: rgba(255,255,255,0.05); border-radius:5px; overflow:hidden; }
.gbar-fill{ height:100%; border-radius:5px; }
.gbar-count{ width:34px; flex:none; color:var(--lavender-dim); font-size:11px; }

.searchbar{ display:flex; align-items:center; gap:10px; background: var(--bg-elevated); border:1px solid var(--hairline); border-radius: var(--radius); padding: 11px 15px; margin-bottom: 18px; }
.searchbar svg{ flex:none; opacity:.6; }
.searchbar input{ flex:1; background:none; border:none; outline:none; color:var(--parchment); font-size:14.5px; }
.searchbar input::placeholder{ color: var(--lavender-dim); }

/* ---- Tabs ---- */
.tabs{ display:flex; gap:4px; margin-bottom: 24px; border-bottom:1px solid var(--hairline); flex-wrap:wrap; overflow-x:auto; }
.tab-btn{ background:none; border:none; color: var(--lavender-dim); font-weight:700; font-size: 13.5px; letter-spacing:.03em; padding: 10px 16px 12px; cursor:pointer; position:relative; transition: color .15s; }
.tab-btn:hover{ color: var(--parchment); }
.tab-btn.active{ color: var(--parchment); }
.tab-btn.active::after{ content:''; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; background: var(--rose); border-radius:2px; }
.tab-panel{ display:none; }
.tab-panel.active{ display:block; animation: fadeIn .25s ease; }
@keyframes fadeIn{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform: translateY(0);} }

section.block{ margin-bottom: 34px; }
.block-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 14px; flex-wrap:wrap; gap:8px; }
.block-head h2{ font-family:'Cormorant Garamond',serif; font-size: 23px; font-weight:600; margin:0; }
.block-head .sub{ font-size: 12px; color: var(--lavender-dim); }

/* ---- Filter chips ---- */
.filter-row{ display:flex; gap:8px; margin-bottom: 18px; flex-wrap:wrap; align-items:center; }
.chip{ background: var(--bg-elevated); border:1px solid var(--hairline); color: var(--lavender); font-weight:700; font-size:12.5px; padding: 7px 13px; border-radius:999px; cursor:pointer; transition: all .15s; }
.chip:hover{ color: var(--parchment); border-color: var(--lavender-dim); }
.chip.active{ background: var(--rose-soft); color: var(--rose); border-color: transparent; }
.chip-sep{ width:1px; height:18px; background:var(--hairline); margin:0 2px; }

/* ---- Recommendation cards (Prossime letture tab) ---- */
.rec-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 12px; }
.rec-carousel{ display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding:4px 2px 12px; -webkit-overflow-scrolling:touch; }
.rec-slide{ flex:none; width:200px; scroll-snap-align:start; background: var(--bg-card); border:1px solid var(--hairline); border-radius: var(--radius); padding:12px; }
.rec-slide h3{ font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:600; margin:2px 0 3px; line-height:1.2; }
.rec-slide .meta{ font-size:12px; color: var(--lavender); }
.rec-slide .tag{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:800; margin:10px 0 4px; display:inline-block; padding:3px 8px; border-radius:5px; }
.rec-cover{ width:100%; aspect-ratio:2/3; border-radius:6px; background-size:cover; background-position:center; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.4); }
.rec-why{ font-size:12px; color: var(--gold); font-style:italic; margin-bottom:10px; min-height:30px; }
.rec-actions{ display:flex; align-items:center; gap:8px; }
.rec-skip{ background:none; border:none; color:var(--lavender); font-size:12px; cursor:pointer; text-decoration:underline; }
.rec-card{ background: var(--bg-card); border:1px solid var(--hairline); border-radius: var(--radius); padding: 16px 16px 14px; transition: transform .18s, box-shadow .18s; }
.rec-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow); }
.rec-card .tag{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; margin-bottom:8px; display:inline-block; padding:3px 8px; border-radius:5px; }
.tag.continue{ background: var(--emerald-soft); color: var(--emerald); }
.tag.start{ background: var(--gold-soft); color: var(--gold); }
.rec-card h3{ font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; margin: 2px 0 3px; line-height:1.2; }
.rec-card .meta{ font-size:12px; color: var(--lavender); margin-bottom: 12px; }
.btn-mark{ background: var(--rose-soft); color: var(--rose); border:none; border-radius:7px; font-size:12px; font-weight:800; padding: 7px 12px; cursor:pointer; }
.btn-mark:hover{ background: var(--rose); color: var(--parchment); }
.empty-note{ font-size:13px; color: var(--lavender-dim); font-style:italic; padding: 6px 2px; }

.queue-list{ display:flex; flex-direction:column; gap:8px; }
.queue-row{ display:flex; align-items:flex-start; gap:12px; background: var(--bg-elevated); border:1px solid var(--hairline); border-radius: var(--radius); padding: 12px 14px; }
.queue-num{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:17px; color:var(--gold); width:22px; flex:none; text-align:center; padding-top:2px; }
.queue-dot{ width:8px; height:8px; border-radius:50%; flex:none; margin-top:8px; }
.queue-info{ flex:1; min-width:0; }
.queue-info b{ font-family:'Cormorant Garamond',serif; font-size:15.5px; font-weight:600; }
.queue-info .meta{ font-size:11.5px; color:var(--lavender); margin-top:2px; }
.queue-release{ font-size:10px; font-weight:800; color:var(--gold); background:var(--gold-soft); padding:2px 7px; border-radius:5px; margin-left:8px; }
.queue-note-input{ width:100%; background:none; border:none; border-bottom:1px dashed var(--hairline); color:var(--lavender); font-size:12px; font-style:italic; padding:5px 0 3px; margin-top:6px; outline:none; }
.queue-note-input:focus{ border-bottom-color:var(--gold); color:var(--parchment); }
.queue-note-input::placeholder{ color: var(--lavender-dim); }
.queue-actions{ display:flex; flex-direction:column; gap:3px; flex:none; }
.queue-actions button{ background:none; border:1px solid var(--hairline); color:var(--lavender-dim); border-radius:5px; width:24px; height:22px; cursor:pointer; font-size:10px; }
.queue-actions button:hover:not(:disabled){ color:var(--parchment); border-color:var(--lavender-dim); }
.queue-actions button:disabled{ opacity:.25; cursor:default; }

.upcoming-list{ display:flex; flex-direction:column; gap:8px; }
.up-row{ display:flex; align-items:center; gap:14px; background: var(--bg-elevated); border:1px solid var(--hairline); border-radius: var(--radius); padding: 11px 15px; }
.up-date{ font-family:'Cormorant Garamond',serif; font-weight:700; color: var(--gold); font-size:15px; width: 96px; flex: none; text-align:center; border-right:1px solid var(--hairline); padding-right:14px; }
.up-info b{ font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:600; }
.up-info div.meta{ font-size:11.5px; color:var(--lavender); margin-top:2px; }
.countdown{ margin-left:auto; font-size:11px; color: var(--lavender-dim); text-align:right; flex:none; }

/* ---- Genre sections / cover grid ---- */
.genre-section{ margin-bottom: 30px; }
.genre-title{ display:flex; align-items:center; gap:9px; margin-bottom: 13px; }
.genre-dot{ width:10px; height:10px; border-radius:50%; flex:none; }
.genre-title h2{ font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; margin:0; }
.genre-title .cnt{ font-size:11.5px; color:var(--lavender-dim); }

.cover-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
.cover-card{
  position:relative; aspect-ratio: 2/3; border-radius: 8px; cursor:pointer; overflow:hidden;
  background: linear-gradient(155deg, var(--gc1), var(--gc2));
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: transform .18s;
}
.cover-card:hover{ transform: translateY(-4px); }
.cover-card::before{
  content:''; position:absolute; inset:0;
  background: rgba(255,255,255,0.04); opacity:.5; transition: opacity .2s;
}
.cover-card.has-cover::before{ opacity:0; }
.cover-card.cover-loading::before{ animation: coverPulse 1.4s ease-in-out infinite; }
@keyframes coverPulse{ 0%,100%{ opacity:.35; } 50%{ opacity:.75; } }
.cover-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.cover-scrim{ position:absolute; left:0; right:0; bottom:0; height:62%; background: linear-gradient(to top, rgba(10,6,15,0.92), rgba(10,6,15,0)); z-index:1; }
.cover-content{ position:absolute; left:9px; right:9px; bottom:9px; z-index:2; }
.cover-content .ct{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:14.5px; line-height:1.15; color:var(--parchment); }
.cover-content .ca{ font-size:10px; color: rgba(242,232,213,0.75); margin-top:3px; }
.cover-stars{ position:absolute; top:8px; left:8px; z-index:2; font-size:9.5px; color:var(--gold); letter-spacing:1px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.cover-badge{ position:absolute; top:8px; right:8px; z-index:2; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; background: rgba(10,6,15,0.75); }
.cover-badge svg{ width:11px; height:11px; }
.cover-ribbon{ position:absolute; top:0; left:14px; width:16px; height:26px; background: var(--gold); z-index:2; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.cover-date{ position:absolute; bottom:9px; left:9px; right:9px; z-index:2; font-size:9px; color: var(--gold); font-weight:800; letter-spacing:.03em; }

/* ---- Detail / Review Modal ---- */
.modal-overlay{ position: fixed; inset:0; background: rgba(10,6,18,0.65); display:none; align-items:center; justify-content:center; z-index: 50; padding: 20px; overflow-y:auto; }
.modal-overlay.open{ display:flex; }
.modal{ background: var(--bg-elevated); border:1px solid var(--hairline); border-radius: 14px; padding: 26px; width: 100%; max-width: 460px; box-shadow: var(--shadow); max-height: 88vh; overflow-y:auto; }
.modal h3{ font-family:'Cormorant Garamond',serif; font-size:24px; margin:0 0 2px; }
.modal .modal-sub{ font-size:12.5px; color:var(--lavender); margin-bottom:18px; }
.field{ margin-bottom: 13px; }
.field label{ display:block; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--lavender); margin-bottom:5px; font-weight:700; }
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
  width:100%; background: var(--bg); border:1px solid var(--hairline); border-radius:7px; padding: 9px 11px;
  color: var(--parchment); font-family:'Karla'; font-size:14px; outline:none;
}
.field textarea{ resize:vertical; min-height:70px; font-family:'Karla'; }
.field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--gold); }
.cover-manual-row{ display:flex; gap:12px; align-items:flex-start; }
.cover-manual-preview{ width:56px; height:84px; flex:none; border-radius:6px; background: var(--bg); border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.cover-manual-preview img{ width:100%; height:100%; object-fit:cover; }
.cover-manual-preview span{ font-size:9px; color:var(--lavender-dim); text-align:center; }
.cover-manual-actions{ flex:1; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.cover-manual-actions input[type=text]{ flex:1; min-width:140px; background: var(--bg); border:1px solid var(--hairline); border-radius:7px; padding: 7px 10px; color:var(--parchment); font-size:12.5px; outline:none; }
.cover-manual-actions input[type=text]:focus{ border-color: var(--gold); }
.cover-manual-actions .btn-mark{ white-space:nowrap; }

.status-seg{ display:flex; gap:6px; }
.status-seg button{ flex:1; background: var(--bg); border:1px solid var(--hairline); color:var(--lavender); font-size:12px; font-weight:700; padding:8px 4px; border-radius:7px; cursor:pointer; }
.status-seg button.active{ background: var(--rose); color:var(--parchment); border-color: transparent; }
.star-input{ display:flex; gap:4px; font-size:26px; cursor:pointer; }
.star-input span{ color: rgba(255,255,255,0.15); transition: color .1s; }
.star-input span.on{ color: var(--gold); }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tagpick{ display:flex; flex-wrap:wrap; gap:6px; }
.tagpick button{ background: var(--bg); border:1px solid var(--hairline); color:var(--lavender); font-size:11.5px; padding:5px 10px; border-radius:999px; cursor:pointer; }
.tagpick button.on{ background: var(--gold-soft); color:var(--gold); border-color:transparent; }
.modal-actions{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:20px; }
.btn{ font-weight:800; font-size:13px; padding: 9px 16px; border-radius:7px; cursor:pointer; border:none; }
.btn-ghost{ background:none; color: var(--lavender); }
.btn-danger{ background:none; color: var(--rose); }
.btn-primary{ background: var(--rose); color: var(--parchment); }
.btn-primary:hover{ background:#8f3a4c; }
.genre-select-row{ display:flex; gap:6px; flex-wrap:wrap; }
.genre-select-row button{ font-size:11px; font-weight:700; padding:5px 11px; border-radius:999px; border:1px solid transparent; cursor:pointer; color: var(--parchment); opacity:.55; }
.genre-select-row button.on{ opacity:1; box-shadow: 0 0 0 2px rgba(255,255,255,0.25) inset; }

.fab{ position: fixed; bottom: 26px; right: 26px; background: var(--rose); color: var(--parchment); border:none; width:52px; height:52px; border-radius:50%; font-size:26px; cursor:pointer; box-shadow: var(--shadow); z-index: 40; display:flex; align-items:center; justify-content:center; transition: transform .15s; }
.fab:hover{ transform: scale(1.06); }

.save-status{ font-size:11px; font-weight:700; letter-spacing:.02em; padding:4px 10px; border-radius:999px; opacity:0; transition:opacity .2s; }
.save-status.saving{ opacity:1; background: var(--gold-soft); color: var(--gold); }
.save-status.saved{ opacity:1; background: var(--emerald-soft); color: var(--emerald); }
.save-status.error{ opacity:1; background: var(--rose-soft); color: var(--rose); }

.shelf-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:12px; }
.shelf-bar select{ background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--parchment); border-radius:7px; padding:6px 10px; font-size:12.5px; }
.shelf-stat{ font-size:12px; color:var(--lavender); }
.shelf-stat b{ color:var(--gold); font-family:'Cormorant Garamond',serif; font-size:16px; }
.shelf-pick{ font-size:13px; color:var(--parchment); min-height:0; margin-bottom:8px; font-style:italic; }
.shelf-pick:empty{ display:none; }
.spine.glow{ animation: spineGlow 1.1s ease 3; z-index:3; }
@keyframes spineGlow{ 0%,100%{ transform:translateY(0); box-shadow:0 3px 6px rgba(0,0,0,.35);} 50%{ transform:translateY(-12px); box-shadow:0 0 0 2px var(--gold), 0 14px 22px rgba(0,0,0,.6);} }
.shelf-container{
  display:flex; flex-wrap:wrap; align-items:flex-end; align-content:flex-start;
  gap:2px; row-gap:30px; padding: 18px 16px 8px;
  background:
    /* wood plank: lit top edge, grain, dark underside, then a soft shadow on the back wall */
    repeating-linear-gradient(to bottom,
      transparent 0px, transparent 172px,
      #8a6338 172px, #8a6338 173px,
      #6b4a2b 173px, #5a3d22 178px,
      #46301b 178px, #3a2714 184px,
      #1d130a 184px, #1d130a 186px,
      rgba(0,0,0,.45) 186px, rgba(0,0,0,0) 202px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0px, rgba(0,0,0,.05) 2px, transparent 2px, transparent 7px),
    linear-gradient(180deg, #1c1424, #130d1a);
  background-position: 0 18px, 0 0, 0 0;
  background-repeat: repeat-y, repeat, no-repeat;
  border-radius: 8px;
  border: 8px solid #3a2916;
  border-image: linear-gradient(135deg, #5a3d22, #2d1f10 50%, #4a3520) 1;
  box-shadow: inset 0 8px 18px rgba(0,0,0,.55), inset 8px 0 14px rgba(0,0,0,.35), inset -8px 0 14px rgba(0,0,0,.35);
}
.spine{
  height:172px; border-radius: 3px 3px 2px 2px; cursor:pointer; position:relative; flex:none;
  box-shadow: 1px 0 0 rgba(255,255,255,0.08) inset, -1px 0 0 rgba(0,0,0,0.25) inset, 0 3px 6px rgba(0,0,0,0.35);
  display:flex; align-items:center; justify-content:center; transition: transform .15s, box-shadow .15s;
  overflow:hidden;
}
.spine:hover{ transform: translateY(-6px) rotate(0deg) !important; box-shadow: 1px 0 0 rgba(255,255,255,0.1) inset, -1px 0 0 rgba(0,0,0,0.25) inset, 0 10px 16px rgba(0,0,0,0.45); z-index:2; }
.spine-band{ position:absolute; z-index:1; left:2px; right:2px; height:4px; background: rgba(255,255,255,0.18); border-radius:2px; }
.spine-band.top{ top:10px; }
.spine-band.bottom{ bottom:10px; }
.spine-scrim{ position:absolute; z-index:1; inset:0; background: linear-gradient(180deg, rgba(10,6,15,0.35), rgba(10,6,15,0.55) 50%, rgba(10,6,15,0.7)); }
.spine-title{
  position:relative; z-index:2;
  writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
  font-family:'Cormorant Garamond',serif; font-weight:700; font-size:11.5px; color: rgba(242,232,213,0.95);
  max-height:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:.01em;
  text-shadow: 0 1px 3px rgba(0,0,0,0.7);
}

.badge-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:12px; }
.badge-del{ position:absolute; top:6px; right:8px; background:none; border:none; color:var(--lavender); font-size:13px; cursor:pointer; opacity:.6; }
.badge-del:hover{ opacity:1; color:var(--rose); }
.badge-card{ position:relative; background: var(--bg-card); border:1px solid var(--gold); border-radius: var(--radius); padding: 16px 12px; text-align:center; }
.badge-medal{ width:54px; height:54px; margin:0 auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; background: radial-gradient(circle at 30% 25%, #f0d28a, #c9a24e 60%, #8c6d2a); box-shadow: 0 0 0 3px var(--gold-soft), 0 3px 8px rgba(0,0,0,.4); }
.badge-name{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; color:var(--parchment); line-height:1.15; }
.badge-detail{ font-size:11.5px; color:var(--lavender); margin-top:4px; }

/* ================= COVER FETCHING (Open Library) ================= */
async function fetchCoverFor(book){
  try{
    const params = new URLSearchParams({ title: book.title.replace(/\s*\(.*?\)\s*/g,''), author: book.author, limit: 1, fields: 'cover_i' });
    const res = await fetch('https://openlibrary.org/search.json?' + params.toString());
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    const doc = data.docs && data.docs[0];
    book.coverUrl = (doc && doc.cover_i) ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : null;
  } catch(e){
    book.coverUrl = null;
  }
  book.coverChecked = true;
}
function patchCoverInDom(book){
  document.querySelectorAll(`.cover-card[data-open="${book.id}"]`).forEach(el=>{
    el.classList.remove('cover-loading');
    if(book.coverUrl){
      el.classList.add('has-cover');
      if(!el.querySelector('.cover-img')){
        const img = document.createElement('img');
        img.className = 'cover-img';
        img.loading = 'lazy';
        img.src = book.coverUrl;
        img.onerror = ()=>{ img.remove(); el.classList.remove('has-cover'); };
        el.insertBefore(img, el.firstChild);
      }
    }
  });
}
let coverQueueRunning = false;
async function runCoverQueue(){
  if(coverQueueRunning) return;
  coverQueueRunning = true;
  const pending = books.filter(b=>!b.coverChecked);
  const CONCURRENCY = 4;
  let idx = 0, sinceSave = 0;
  async function worker(){
    while(idx < pending.length){
      const b = pending[idx++];
      await fetchCoverFor(b);
      patchCoverInDom(b);
      sinceSave++;
      if(sinceSave >= 8){ sinceSave = 0; await saveData(); }
    }
  }
  await Promise.all(Array.from({length: Math.min(CONCURRENCY, pending.length)}, worker));
  await saveData();
  coverQueueRunning = false;
}

/* ================= FIREBASE SETUP / ONBOARDING ================= */
let db = null, docRef = null;

function getSavedConfig(){
  try{
    const cfg = localStorage.getItem('lib-fb-config');
    const code = localStorage.getItem('lib-code');
    if(cfg && code) return { config: JSON.parse(cfg), code };
  }catch(e){}
  return null;
}
function parseFirebaseConfigText(text){
  const anchorIdx = text.indexOf('firebaseConfig');
  const searchFrom = anchorIdx !== -1 ? text.slice(anchorIdx) : text;
  const start = searchFrom.indexOf('{');
  if(start === -1) throw new Error('Non trovo un oggetto { } nella configurazione.');
  let depth = 0, end = -1;
  for(let i = start; i < searchFrom.length; i++){
    if(searchFrom[i] === '{') depth++;
    else if(searchFrom[i] === '}'){ depth--; if(depth === 0){ end = i; break; } }
  }
  if(end === -1) throw new Error('La configurazione sembra incompleta (parentesi non chiuse).');
  const objText = searchFrom.slice(start, end + 1);
  return new Function('return ' + objText)();
}
function initFirebase(config, code){
  if(!firebase.apps.length) firebase.initializeApp(config);
  db = firebase.firestore();
  docRef = db.collection('libraries').doc(code);
}

async function importBackupFile(file){

  const incoming = Array.isArray(parsed) ? parsed : parsed.books;

  books = incoming;
  plans = Array.isArray(parsed.plans) ? parsed.plans : [];
  challenges = Array.isArray(parsed.challenges) ? parsed.challenges : [];
  badges = Array.isArray(parsed.badges) ? parsed.badges : [];

/* ================= READING PLANS (several manual ordered lists) ================= */
function newPlanId(){ return 'plan-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function getPlanBooks(planId){
  return books.filter(b=>b.queuePlan===planId && b.queueOrder!=null).sort((a,b)=>a.queueOrder-b.queueOrder);
}
function getAllPlannedBooks(){
  return books.filter(b=>b.queuePlan && b.queueOrder!=null);
}
function getPlan(planId){ return plans.find(p=>p.id===planId) || null; }
function planPosition(book){
  if(!book.queuePlan || book.queueOrder==null) return null;
  return getPlanBooks(book.queuePlan).findIndex(b=>b.id===book.id) + 1;
}
function renormalizePlan(planId){
  getPlanBooks(planId).forEach((b,i)=> b.queueOrder = i+1);
}
async function addToPlan(book, planId){
  // a book lives in one plan at a time: leaving a previous plan closes the gap there
  const oldPlan = book.queuePlan;
  if(oldPlan === planId && book.queueOrder!=null) return;
  book.queueOrder = null;
  if(oldPlan) renormalizePlan(oldPlan);
  book.queuePlan = planId;
  book.queueOrder = getPlanBooks(planId).length + 1;
  await saveData();
}
async function removeFromPlan(book){
  const oldPlan = book.queuePlan;
  book.queueOrder = null;
  book.queuePlan = null;
  book.queueNote = '';
  if(oldPlan) renormalizePlan(oldPlan);
  await saveData();
}
async function reorderPlan(planId, orderedIds){
  orderedIds.forEach((id,i)=>{
    const b = books.find(x=>x.id===id);
    if(b) b.queueOrder = i+1;
  });
  await saveData();
}
async function createPlan(name){
  const plan = { id:newPlanId(), name: name.trim() };
  plans.push(plan);
  await saveData();
  return plan;
}
async function renamePlan(planId, name){
  const p = getPlan(planId);
  if(p){ p.name = name.trim(); await saveData(); }
}
async function deletePlan(planId){
  books.forEach(b=>{
    if(b.queuePlan===planId){ b.queuePlan = null; b.queueOrder = null; b.queueNote = ''; }
  });
  plans = plans.filter(p=>p.id!==planId);
  await saveData();
}
// pure helper: where would the dragged row land? (centers = original vertical centers of all rows)
function computeDropIndex(centers, fromIdx, draggedCenter){
  return centers.filter((c,i)=> i!==fromIdx && c < draggedCenter).length;
}

async function migrateReleased(){

async function migratePlans(){

  if(!Array.isArray(plans)) { plans = []; changed = true; }
  if(plans.length===0){ plans.push({ id:'plan-main', name:'Il mio piano' }); changed = true; }

}

/* ================= READING CHALLENGES ================= */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function newChallengeId(){ return 'ch-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
/* progress of one challenge → {done, total, finished, note} */
function challengeProgress(c){
  if(c.type==='plan'){
    const list = getPlanBooks(c.planId);
    const done = list.filter(b=>b.status==='read').length;
    return { done, total:list.length, finished: list.length>0 && done===list.length };
  }
  if(c.type==='manual'){
    const total = c.target||1, done = c.count||0;
    return { done, total, finished: done>=total };
  }
  const total = c.target||1;
  const done = books.filter(b=>{
    if(b.status!=='read' || !b.dateFinished) return false;
    const d = String(b.dateFinished).slice(0,10);
    return (!c.start || d>=c.start) && (!c.end || d<=c.end);
  }).length;
  return { done, total, finished: done>=total };
}
function challengeTitle(c){
  if(c.title) return c.title;
  if(c.type==='plan'){ const p=getPlan(c.planId); return 'Finisci il piano' + (p?` "${p.name}"`:''); }
  if(c.type==='manual') return `Obiettivo: ${c.target||'…'}`;
  return `Leggi ${c.target||'…'} libri`;
}
function challengeDeadline(c){
  if(!c.end) return '';
  const d = daysUntil(c.end);
  if(d<0) return `scaduta il ${fmtDate(c.end)}`;
  if(d===0) return 'scade oggi';
  return `entro il ${fmtDate(c.end)} · ${d===1?'manca 1 giorno':`mancano ${d} giorni`}`;
}

const BADGE_MESSAGES = [
  'Ce l\'hai fatta! Un\'altra pagina di storia tra i tuoi libri.',

];
function collectCompletedChallenges(){
  const earned = [];
  challenges = challenges.filter(c=>{
    const pr = challengeProgress(c);
    if(!pr.finished) return true;
    let detail = '';
    if(c.type==='plan'){ const p = getPlan(c.planId); detail = `Piano${p?` "${p.name}"`:''} completato · ${pr.total} libri`; }
    else if(c.type==='books') detail = `${c.target} libri letti${c.end?` entro il ${fmtDate(c.end)}`:''}`;
    else detail = `Obiettivo ${c.target} raggiunto`;
    earned.push({ id:'bd-'+c.id, title: challengeTitle(c), type:c.type, detail, earnedAt: todayISO() });
    return false;
  });
  if(earned.length) badges = badges.concat(earned);
  return earned;
}

/* ================= HELPERS ================= */
function sagaKey(b){ return b.author+'|||'+b.saga; }
function groupBySaga(list){
  const map = new Map();
  list.forEach(b=>{ const k=sagaKey(b); if(!map.has(k)) map.set(k,[]); map.get(k).push(b); });
  map.forEach(arr=>arr.sort((a,b)=>a.order-b.order));
  return map;
}
function fmtDate(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}); }
function daysUntil(iso){ const d=new Date(iso+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0); return Math.round((d-now)/86400000); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function starString(n){ return '★★★★★☆☆☆☆☆'.slice(5-n,10-n); }
function allGenres(){ return [...new Set(books.map(b=>b.genre))].sort(); }

/* ================= RECOMMENDATIONS ================= */
function buildRecommendations(){
  const sagas = groupBySaga(books);
  const continues=[], starts=[];
  sagas.forEach((list,key)=>{
    const [author,saga] = key.split('|||');
    const readCount = list.filter(b=>b.status==='read').length;
    const total = list.length;
    if(readCount===0){
      const first=list[0];
      starts.push({author,saga,book:first,priority:first.seriesPriority,note:first.seriesNote,total});
    } else if(readCount<total){
      const next = list.find(b=>b.status!=='read');
      if(next && !next.upcoming) continues.push({author,saga,book:next,readCount,total});
    }
  });
  starts.sort((a,b)=>(a.priority??999)-(b.priority??999));
  continues.sort((a,b)=>(b.readCount/b.total)-(a.readCount/a.total));
  return {continues, starts};
}
function buildUpcoming(){ return books.filter(b=>b.upcoming && b.releaseDate && daysUntil(b.releaseDate)>=0).sort((a,b)=>a.releaseDate.localeCompare(b.releaseDate)); }

    </div>
    <div class="genre-bars">
      ${genres.map(g=>{
        const cnt = books.filter(b=>b.genre===g).length;
        const gs = genreStyle(g);
        return `<div class="gbar-row"><div class="gbar-label">${escapeHtml(g)}</div><div class="gbar-track"><div class="gbar-fill" style="width:${(cnt/maxG*100).toFixed(0)}%; background:${gs.dot};"></div></div><div class="gbar-count">${cnt}</div></div>`;

/* ================= RENDER: PANORAMICA ================= */
function getDismissedRecs(){ try{ return new Set(JSON.parse(localStorage.getItem('rec-dismissed')||'[]')); }catch(e){ return new Set(); } }
function setDismissedRecs(set){ try{ localStorage.setItem('rec-dismissed', JSON.stringify([...set])); }catch(e){} }
function renderPanoramica(){
  const panel = document.getElementById('panel-panoramica');
  const {continues, starts} = buildRecommendations();
  const upcoming = buildUpcoming().slice(0,3);
  const recentlyRead = books.filter(b=>b.status==='read').slice(-4).reverse();
  const thisYear = new Date().getFullYear();
  const readThisYear = books.filter(b=>b.status==='read' && b.dateFinished && new Date(b.dateFinished).getFullYear()===thisYear).length;

  let html = `<section class="block"><div class="block-head"><h2>Il tuo obiettivo ${thisYear}</h2><span class="sub" id="goalEditLink" style="cursor:pointer; text-decoration:underline;">${yearlyGoal? 'modifica':'imposta un obiettivo'}</span></div>`;
  if(yearlyGoal){
    const pct = Math.min(100, Math.round(readThisYear/yearlyGoal*100));
    html += `<div class="goal-box">
      <div class="goal-track"><div class="goal-fill" style="width:${pct}%;"></div></div>
      <div class="goal-label"><b>${readThisYear}</b> di ${yearlyGoal} libri — ${pct}%</div>
    </div>`;
  } else {
    html += `<div class="empty-note">Non hai ancora un obiettivo per quest'anno. Clicca "imposta un obiettivo" per iniziare a tracciarlo.</div>`;
  }
  html += `</section>`;

  html += `<section class="block"><button class="dice-btn" id="btnDicePick">🎲 Cosa leggo stasera?</button></section>`;

  const recAll = [];
  continues.forEach(c=> recAll.push({ kind:'continue', book:c.book, author:c.author, saga:c.saga, readCount:c.readCount, total:c.total }));
  starts.forEach(st=> recAll.push({ kind:'start', book:st.book, author:st.author, saga:st.saga, total:st.total, note:st.note }));
  const dismissed = getDismissedRecs();
  const visibleRecs = recAll.filter(r=> !dismissed.has(r.book.id)).slice(0,5);
  const hiddenCount = recAll.filter(r=> dismissed.has(r.book.id)).length;

  html += `<section class="block"><div class="block-head"><h2>Cosa leggere dopo</h2><span class="sub">${hiddenCount?`<span id="recReset" style="cursor:pointer;text-decoration:underline;">rimostra i ${hiddenCount} nascosti</span>`:'consigliato per te'}</span></div>`;
  if(visibleRecs.length===0) html += `<div class="empty-note">${recAll.length?'Hai scartato tutti i consigli.':'Nessun suggerimento — aggiungi qualche libro dalla libreria.'}</div>`;
  else {
    html += `<div class="rec-carousel">`;
    visibleRecs.forEach(r=>{
      const b = r.book, gs = genreStyle(b.genre);
      const cached = b.coverUrl || customCoverCache[b.customCoverId];
      const left = r.total - (r.readCount||0);
      let reason;
      if(r.kind==='continue') reason = left===1 ? 'Ti manca solo 1 libro per finire la saga!' : `Ti mancano ${left} libri per finire la saga.`;
      else if(b.queuePlan && getPlan(b.queuePlan)) reason = `È nel tuo piano «${getPlan(b.queuePlan).name}».`;
      else reason = r.total>1 ? `Nuova saga da ${r.total} libri.` : 'Un libro autoconclusivo da iniziare.';
      const cov = cached ? `background-image:url('${cached}');` : `background:linear-gradient(180deg, ${gs.c2}, ${gs.c1});`;
      html += `<div class="rec-slide">
        <div class="rec-cover" data-reccover="${b.id}" data-open="${b.id}" style="${cov}"></div>
        <span class="tag ${r.kind==='continue'?'continue':'start'}">${r.kind==='continue'?`Continua · ${r.readCount}/${r.total}`:'Nuova saga'}</span>
        <h3>${escapeHtml(b.title)}</h3>
        <div class="meta" style="margin-bottom:6px;">${escapeHtml(r.author)} · <i>${escapeHtml(r.saga)}</i></div>
        <div class="rec-why">${escapeHtml(reason)}</div>
        <div class="rec-actions"><button class="btn-mark" data-open="${b.id}">Apri libro</button><button class="rec-skip" data-recskip="${b.id}">Non ora</button></div>
      </div>`;
      if(!cached && b.customCoverId){
        fetchCustomCover(b.customCoverId).then(data=>{ if(!data) return; const el = document.querySelector(`[data-reccover="${b.id}"]`); if(el){ el.style.background=''; el.style.backgroundImage=`url('${data}')`; } });
      }
    });
    html += `</div>`;
  }
  html += `</section>`;

  html += `<section class="block"><div class="block-head"><h2>In arrivo a breve</h2><span class="sub">vedi tutte in "Prossime letture"</span></div>`;
  if(upcoming.length===0) html += `<div class="empty-note">Nessuna uscita programmata al momento.</div>`;
  else{
    html += `<div class="upcoming-list">`;
    upcoming.forEach(u=>{
      const d=daysUntil(u.releaseDate);
      html += `<div class="up-row"><div class="up-date">${fmtDate(u.releaseDate)}</div><div class="up-info"><b>${escapeHtml(u.title)}</b><div class="meta">${escapeHtml(u.author)} · ${escapeHtml(u.saga)}</div></div><div class="countdown">${d===0?'esce oggi':d===1?'domani':`tra ${d} giorni`}</div></div>`;
    });
    html += `</div>`;
  }
  html += `</section>`;

  html += `<section class="block"><div class="block-head"><h2>Ultime letture</h2></div>`;
  if(recentlyRead.length===0) html += `<div class="empty-note">Non hai ancora segnato libri come letti.</div>`;
  else{
    html += `<div class="cover-grid">`;
    recentlyRead.forEach(b=> html += coverCardHtml(b));
    html += `</div>`;
  }
  html += `</section>`;

  panel.innerHTML = html;
  wireCommon(panel);
  document.getElementById('btnDicePick').addEventListener('click', openDicePick);
  panel.querySelectorAll('[data-recskip]').forEach(el=> el.addEventListener('click', ()=>{ const d = getDismissedRecs(); d.add(el.dataset.recskip); setDismissedRecs(d); renderPanoramica(); }));
  const rr = document.getElementById('recReset'); if(rr) rr.addEventListener('click', ()=>{ setDismissedRecs(new Set()); renderPanoramica(); });
  document.getElementById('goalEditLink').addEventListener('click', async ()=>{
    const val = prompt('Quanti libri vuoi leggere entro fine ' + thisYear + '?', yearlyGoal || '');
    if(val===null) return;
    const n = parseInt(val,10);
    if(!isNaN(n) && n>0){ yearlyGoal = n; await saveData(); render(); }
  });
}

/* ================= RENDER: LETTURE (TBR + releases) ================= */

  const queue = activePlanId ? getPlanBooks(activePlanId) : [];

    const n = getPlanBooks(p.id).length;

          <input type="text" class="queue-note-input" data-note="${b.id}" placeholder="Aggiungi una nota (es. rileggi prima di ottobre)…" value="${escapeHtml(b.queueNote||'')}">
        </div>
        <div class="queue-actions">
          <button data-qremove="${b.id}" title="Togli dal piano">✕</button>
        </div>
      </div>`;
    });

  }
  html += `</section>`;

  html += `<section class="block"><div class="block-head"><h2>Continua le saghe iniziate</h2></div><div class="rec-grid">`;
  if(continues.length===0) html += `<div class="empty-note">Nessuna saga in corso al momento.</div>`;
  continues.forEach(c=>{
    html += `<div class="rec-card"><span class="tag continue">${c.readCount}/${c.total} letti</span><h3>${escapeHtml(c.book.title)}</h3><div class="meta">${escapeHtml(c.author)} · <i>${escapeHtml(c.saga)}</i></div><button class="btn-mark" data-open="${c.book.id}">Apri libro</button></div>`;
  });
  html += `</div></section>`;

  html += `<section class="block"><div class="block-head"><h2>Tutte le prossime uscite</h2></div>`;
  if(upcoming.length===0) html += `<div class="empty-note">Nessuna uscita futura registrata.</div>`;
  else{
    html += `<div class="upcoming-list">`;
    upcoming.forEach(u=>{
      const d=daysUntil(u.releaseDate);
      html += `<div class="up-row" data-open="${u.id}" style="cursor:pointer"><div class="up-date">${fmtDate(u.releaseDate)}</div><div class="up-info"><b>${escapeHtml(u.title)}</b><div class="meta">${escapeHtml(u.author)} · ${escapeHtml(u.saga)}${u.seriesNote?(' · '+escapeHtml(u.seriesNote)):''}</div></div><div class="countdown">${d===0?'esce oggi':d===1?'domani':`tra ${d} giorni`}</div></div>`;

  }

  if(bNew) bNew.addEventListener('click', async ()=>{

  panel.querySelectorAll('[data-note]').forEach(el=>{
    el.addEventListener('click', e=> e.stopPropagation());
    el.addEventListener('change', async ()=>{
      const b = books.find(x=>x.id===el.dataset.note);
      if(b){ b.queueNote = el.value.trim(); await saveData(); }
    });
  });
}

function wireQueueDrag(panel){
  const list = panel.querySelector('#queueList');
  if(!list) return;
  list.querySelectorAll('[data-handle]').forEach(handle=>{
    handle.addEventListener('pointerdown', ev=>{
      if(ev.button!==undefined && ev.button>0) return;
      ev.preventDefault();
      const rows = Array.from(list.querySelectorAll('.queue-row'));
      const row = handle.closest('.queue-row');
      const fromIdx = rows.indexOf(row);
      const rects = rows.map(r=>r.getBoundingClientRect());
      const centers = rects.map(r=> r.top + r.height/2 + window.scrollY);
      const startY = ev.clientY + window.scrollY;
      let curY = ev.clientY, dy = 0, raf = null, done = false;
      row.classList.add('dragging');
      try{ handle.setPointerCapture(ev.pointerId); }catch(e){}
      const update = ()=>{
        dy = (curY + window.scrollY) - startY;
        row.style.transform = `translateY(${dy}px)`;
        const to = computeDropIndex(centers, fromIdx, centers[fromIdx] + dy);
        rows.forEach((r,i)=>{
          if(i===fromIdx) return;
          let shift = 0;
          if(fromIdx<to && i>fromIdx && i<=to) shift = -rects[fromIdx].height;
          if(fromIdx>to && i<fromIdx && i>=to) shift = rects[fromIdx].height;
          r.style.transform = shift ? `translateY(${shift}px)` : '';
        });
      };
      const tick = ()=>{
        if(done) return;
        const h = window.innerHeight;
        if(curY < 70) window.scrollBy(0, -12);
        else if(curY > h-70) window.scrollBy(0, 12);
        update();
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      const move = e=>{ curY = e.clientY; update(); };
      const finish = async (cancel)=>{
        if(done) return; done = true;
        if(raf) cancelAnimationFrame(raf);
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', cancelH);
        const to = computeDropIndex(centers, fromIdx, centers[fromIdx] + dy);
        if(cancel || to===fromIdx){ rows.forEach(r=>{ r.style.transform=''; r.classList.remove('dragging'); }); return; }
        const ids = rows.map(r=>r.dataset.qid);
        const [m] = ids.splice(fromIdx,1); ids.splice(to,0,m);
        await reorderPlan(activePlanId, ids);
        renderLetture();
      };
      const up = ()=> finish(false);
      const cancelH = ()=> finish(true);
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', cancelH);
    });
  });
}

/* ================= RENDER: LIBRERIA (genre grid) ================= */
function coverCardHtml(b){
  const gs = genreStyle(b.genre);
  let badge = '';
  if(b.status==='read') badge = `<div class="cover-badge" style="background:${gs.dot}dd;"><svg viewBox="0 0 24 24" fill="none" stroke="#17101f" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>`;
  const ribbon = b.status==='reading' ? `<div class="cover-ribbon"></div>` : '';
  const stars = b.status==='read' && b.rating ? `<div class="cover-stars">${starString(b.rating)}</div>` : '';
  const datePill = b.upcoming ? `<div class="cover-date">${b.releaseDate? fmtDate(b.releaseDate):'in arrivo'}</div>` : '';

  let img = '', hasCover = false, loadingCls = '';
  if(b.coverUrl){
    hasCover = true;
    img = `<img class="cover-img" loading="lazy" src="${b.coverUrl}">`;
  } else if(b.customCoverId){
    const cached = customCoverCache[b.customCoverId];
    if(cached){ hasCover = true; img = `<img class="cover-img" loading="lazy" src="${cached}">`; }
    else{
      loadingCls = ' cover-loading';
      fetchCustomCover(b.customCoverId).then(data=>{ if(data) patchCustomCoverInDom(b.id, data); });
    }
  } else if(!b.coverChecked){
    loadingCls = ' cover-loading';
  }

  return `<div class="cover-card${hasCover?' has-cover':''}${loadingCls}" style="--gc1:${gs.c1};--gc2:${gs.c2};" data-open="${b.id}">
      ${img}${ribbon}${stars}${badge}
      <div class="cover-scrim"></div>
      <div class="cover-content"><div class="ct">${escapeHtml(b.title)}</div><div class="ca">${escapeHtml(b.author)}</div></div>
      ${datePill}
    </div>`;
}
function patchCustomCoverInDom(bookId, dataUrl){
  document.querySelectorAll(`.cover-card[data-open="${bookId}"]`).forEach(el=>{
    el.classList.remove('cover-loading');
    el.classList.add('has-cover');
    if(!el.querySelector('.cover-img')){
      const img = document.createElement('img');
      img.className = 'cover-img';
      img.loading = 'lazy';
      img.src = dataUrl;
      el.insertBefore(img, el.firstChild);
    }
  });
}

function renderLibreria(){
  const panel = document.getElementById('panel-libreria');
  const validGenres = allGenres();
  if(genreFilter !== 'tutti' && !validGenres.includes(genreFilter)) genreFilter = 'tutti';
  if(!['tutti','letti','lettura','daleggere'].includes(statusFilter)) statusFilter = 'tutti';
  const term = searchTerm.trim().toLowerCase();
  let filtered = books;
  if(term) filtered = filtered.filter(b => b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term) || b.saga.toLowerCase().includes(term));
  if(statusFilter==='letti') filtered = filtered.filter(b=>b.status==='read');
  if(statusFilter==='lettura') filtered = filtered.filter(b=>b.status==='reading');
  if(statusFilter==='daleggere') filtered = filtered.filter(b=>b.status==='toread');
  if(genreFilter!=='tutti') filtered = filtered.filter(b=>b.genre===genreFilter);

  const readTotal = books.filter(b=>b.status==='read').length;
  const readingTotal = books.filter(b=>b.status==='reading').length;
  const toReadTotal = books.filter(b=>b.status==='toread').length;

  let html = `<div class="filter-row">
    <button class="chip ${statusFilter==='tutti'?'active':''}" data-status="tutti">Tutti (${books.length})</button>
    <button class="chip ${statusFilter==='letti'?'active':''}" data-status="letti">Letti (${readTotal})</button>
    <button class="chip ${statusFilter==='lettura'?'active':''}" data-status="lettura">In lettura (${readingTotal})</button>
    <button class="chip ${statusFilter==='daleggere'?'active':''}" data-status="daleggere">Da leggere (${toReadTotal})</button>
  </div>
  <div class="filter-row">
    <button class="chip ${genreFilter==='tutti'?'active':''}" data-genre="tutti">Tutti i generi</button>
    ${allGenres().map(g=>`<button class="chip ${genreFilter===g?'active':''}" data-genre="${escapeHtml(g)}">${escapeHtml(g)}</button>`).join('')}
  </div>`;

  if(filtered.length===0){
    const reasons = [];
    if(term) reasons.push(`la ricerca "${escapeHtml(searchTerm)}"`);
    if(statusFilter!=='tutti') reasons.push(`lo stato "${statusFilter}"`);
    if(genreFilter!=='tutti') reasons.push(`il genere "${escapeHtml(genreFilter)}"`);
    const reasonText = reasons.length ? ' (' + reasons.join(', ') + ')' : '';
    html += `<div class="empty-note">Nessun libro trovato con questi filtri${reasonText}.</div>`;
    panel.innerHTML = html;
    wireCommon(panel);
    return;
  }

  const byGenre = {};
  filtered.forEach(b=>{ byGenre[b.genre] = byGenre[b.genre]||[]; byGenre[b.genre].push(b); });
  const genreOrder = Object.keys(byGenre).sort((a,b)=> byGenre[b].length - byGenre[a].length);

  genreOrder.forEach(g=>{
    const gs = genreStyle(g);
    const list = byGenre[g].sort((a,b)=> a.author.localeCompare(b.author) || a.order-b.order);
    html += `<div class="genre-section">
      <div class="genre-title"><div class="genre-dot" style="background:${gs.dot}"></div><h2>${escapeHtml(g)}</h2><span class="cnt">${list.length} libri</span></div>
      <div class="cover-grid">${list.map(coverCardHtml).join('')}</div>
    </div>`;
  });

  panel.innerHTML = html;
  wireCommon(panel);
}

          const scale = Math.min(1, maxWidth / img.width);

          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.8));

        img.onerror = reject;

/* ================= RENDER: SCAFFALE (bookshelf of read books) ================= */
function strHash(s){ let h=0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h; }
const SHELF_SORTS = {
  autrice: 'Per autrice',
  recenti: 'Letti di recente',
  vecchi: 'Letti da più tempo',
  voto: 'Per voto',
  colore: 'Per colore (arcobaleno)',
  genere: 'Per genere',
  titolo: 'Per titolo',
};
let shelfSort = (()=>{ try{ return localStorage.getItem('shelf-sort')||'autrice'; }catch(e){ return 'autrice'; } })();
const coverHueCache = {};
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let h=0, sat=0;
  if(mx!==mn){
    const d=mx-mn; sat = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d + (g<b?6:0) : mx===g ? (b-r)/d + 2 : (r-g)/d + 4; h*=60;
  }
  return {h, s:sat, l};
}
function loadCoverHue(url){
  return new Promise(res=>{
    if(coverHueCache[url]) return res(coverHueCache[url]);
    try{
      const img = new Image(); img.crossOrigin='anonymous';
      img.onload = ()=>{ try{
        const c=document.createElement('canvas'); c.width=c.height=12;
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,12,12);
        const d=ctx.getImageData(0,0,12,12).data; let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=4){ const w=0.3+(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]))/32; r+=d[i]*w; g+=d[i+1]*w; b+=d[i+2]*w; n+=w; }
        res(coverHueCache[url] = rgbToHsl(r/n,g/n,b/n));
      }catch(e){ res(null); } };
      img.onerror = ()=>res(null);
      img.src = url;
    }catch(e){ res(null); }
  });
}
function colorSortKey(b){
  const url = b.coverUrl || customCoverCache[b.customCoverId];
  const c = url && coverHueCache[url];
  if(!c) return 2000;                         // unknown colour → end of the shelf
  return c.s < 0.18 ? 1000 + (1 - c.l)*100 : c.h; // greys/black/white after the rainbow
}
function sortShelfBooks(list){
  const byAuthor = (a,b)=> a.author.localeCompare(b.author) || a.saga.localeCompare(b.saga) || a.order-b.order;
  const arr = list.slice();
  switch(shelfSort){
    case 'recenti': return arr.sort((a,b)=> (b.dateFinished||'').localeCompare(a.dateFinished||'') || byAuthor(a,b));
    case 'vecchi':  return arr.sort((a,b)=> (a.dateFinished||'9999').localeCompare(b.dateFinished||'9999') || byAuthor(a,b));
    case 'voto':    return arr.sort((a,b)=> (b.rating||0)-(a.rating||0) || byAuthor(a,b));
    case 'colore':  return arr.sort((a,b)=> colorSortKey(a)-colorSortKey(b) || byAuthor(a,b));
    case 'genere':  return arr.sort((a,b)=> a.genre.localeCompare(b.genre) || byAuthor(a,b));
    case 'titolo':  return arr.sort((a,b)=> a.title.localeCompare(b.title));
    default:        return arr.sort(byAuthor);
  }
}
let shelfHueRun = 0;
async function ensureShelfHues(list){
  const urls = [...new Set(list.map(b=>b.coverUrl || customCoverCache[b.customCoverId]).filter(Boolean))].filter(u=>!coverHueCache[u]);
  if(!urls.length) return false;
  const run = ++shelfHueRun;
  await Promise.all(urls.map(loadCoverHue));
  return run === shelfHueRun;
}
function renderScaffale(){
  const panel = document.getElementById('panel-scaffale');
  const all = books.filter(b=>b.status==='read');
  const readBooks = sortShelfBooks(all);

  let html = `<section class="block"><div class="block-head"><h2>Il tuo scaffale</h2><span class="sub">${all.length} libri letti</span></div>`;
  if(all.length===0){
    html += `<div class="empty-note">Non hai ancora libri letti da mettere in mostra. Segna qualcosa come "Letto" e torna qui!</div></section>`;
  } else {
    html += `<div class="shelf-container">`;
    readBooks.forEach(b=>{ html += spineHtml(b); });
    html += `</div>`;
    html += `</section>`;
  }

  panel.innerHTML = html;
  wireCommon(panel);
  if(shelfSort==='colore'){
    const mySort = shelfSort;
    ensureShelfHues(all).then(fresh=>{ if(fresh && shelfSort===mySort && activeTab==='scaffale') renderScaffale(); });
  }
}
function spineHtml(b){
  const gs = genreStyle(b.genre);
  const h = strHash(b.id);
  const width = 30 + (h % 22); // 30–52px, gives visual variety like real spines
  const tilt = (h % 5===0) ? (h%2===0?-1.5:1.5) : 0; // occasional slight tilt for realism
  const cached = b.coverUrl || customCoverCache[b.customCoverId];
  const hasCover = !!cached;
  const bg = hasCover ? `background-image:url('${cached}'); background-size:cover; background-position:center;` : `background:linear-gradient(180deg, ${gs.c2}, ${gs.c1});`;
  const loadingAttr = (!hasCover && b.customCoverId) ? ' data-spine-pending="1"' : '';
  const html = `<div class="spine${hasCover?' has-img':''}" data-open="${b.id}"${loadingAttr} title="${escapeHtml(b.title)}"
      style="width:${width}px; ${bg} transform: rotate(${tilt}deg);">
    ${hasCover ? '' : `<div class="spine-band top"></div><div class="spine-band bottom"></div><div class="spine-title">${escapeHtml(b.title)}</div>`}
  </div>`;
  if(!hasCover && b.customCoverId){
    fetchCustomCover(b.customCoverId).then(data=>{ if(data) patchSpineCover(b.id, data); });
  }
  return html;
}
function patchSpineCover(bookId, dataUrl){
  document.querySelectorAll(`.spine[data-open="${bookId}"]`).forEach(el=>{
    el.style.backgroundImage = `url('${dataUrl}')`;
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.classList.add('has-img');
    el.querySelectorAll('.spine-band, .spine-title, .spine-scrim').forEach(x=>x.remove());
  });
}

    html += `</div>`;
  }
  html += `</section>`;

  html += `<section class="block"><div class="block-head"><h2>Il tuo anno in libri</h2>
    <select id="yearPicker" style="background:var(--bg-elevated);border:1px solid var(--hairline);color:var(--parchment);border-radius:7px;padding:5px 9px;font-size:12px;">
      ${availableYears.length ? availableYears.map(y=>`<option value="${y}" ${y===extraYear?'selected':''}>${y}</option>`).join('') : `<option>${extraYear}</option>`}
    </select>
  </div>`;

  if(yearBooks.length===0){
    html += `<div class="empty-note">Nessun libro con data di fine lettura registrata per il ${extraYear}. Apri un libro letto e imposta la "Data fine lettura" per farlo comparire qui.</div></section>`;
  } else {
    const genreCounts = {}; yearBooks.forEach(b=> genreCounts[b.genre]=(genreCounts[b.genre]||0)+1);
    const topGenre = Object.entries(genreCounts).sort((a,b)=>b[1]-a[1])[0];
    const authorCounts = {}; yearBooks.forEach(b=> authorCounts[b.author]=(authorCounts[b.author]||0)+1);
    const topAuthor = Object.entries(authorCounts).sort((a,b)=>b[1]-a[1])[0];
    const rated = yearBooks.filter(b=>b.rating>0);
    const avgRating = rated.length ? (rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1) : '—';
    const monthCounts = {}; yearBooks.forEach(b=>{ const m=new Date(b.dateFinished).getMonth(); monthCounts[m]=(monthCounts[m]||0)+1; });
    const topMonthIdx = Object.entries(monthCounts).sort((a,b)=>b[1]-a[1])[0];
    const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
    const sagaGroups = groupBySaga(books);
    let longestFinishedSaga = null, longestLen = 0;
    sagaGroups.forEach((list,key)=>{
      const allRead = list.every(b=>b.status==='read');
      const finishedThisYear = list.some(b=>b.dateFinished && new Date(b.dateFinished).getFullYear()===extraYear);
      if(allRead && finishedThisYear && list.length>longestLen){ longestLen=list.length; longestFinishedSaga=key.split('|||'); }
    });

    html += `<div class="wrapped-grid">
      <div class="wrapped-card"><div class="wrapped-num">${yearBooks.length}</div><div class="wrapped-label">libri finiti</div></div>
      <div class="wrapped-card"><div class="wrapped-num">${avgRating}</div><div class="wrapped-label">voto medio</div></div>
      <div class="wrapped-card"><div class="wrapped-num" style="font-size:19px;">${topGenre?escapeHtml(topGenre[0]):'—'}</div><div class="wrapped-label">genere del cuore</div></div>
      <div class="wrapped-card"><div class="wrapped-num" style="font-size:19px;">${topAuthor?escapeHtml(topAuthor[0]):'—'}</div><div class="wrapped-label">autrice/autore più letto (${topAuthor?topAuthor[1]:0})</div></div>
      <div class="wrapped-card"><div class="wrapped-num" style="font-size:19px;">${topMonthIdx?monthNames[topMonthIdx[0]]:'—'}</div><div class="wrapped-label">mese più prolifico</div></div>
      <div class="wrapped-card"><div class="wrapped-num" style="font-size:16px;">${longestFinishedSaga?escapeHtml(longestFinishedSaga[1]):'—'}</div><div class="wrapped-label">saga più lunga finita (${longestLen||0} libri)</div></div>
    </div></section>`;
  }

  panel.innerHTML = html;
  wireCommon(panel);
  panel.querySelectorAll('[data-bddel]').forEach(el=> el.addEventListener('click', async ()=>{
    const bd = badges.find(x=>x.id===el.dataset.bddel);
    if(!bd || !confirm('Eliminare il badge "'+bd.title+'"?')) return;
    badges = badges.filter(x=>x.id!==bd.id);
    await saveData(); renderExtra();
  }));
  const bn = document.getElementById('btnNewChallenge');
  if(bn) bn.addEventListener('click', ()=> openChallengeModal(null));
  panel.querySelectorAll('[data-chedit]').forEach(el=> el.addEventListener('click', ()=> openChallengeModal(el.dataset.chedit)));
  const bump = async (id, d)=>{ const c = challenges.find(x=>x.id===id); if(c){ c.count = Math.max(0,(c.count||0)+d); await saveData(); renderExtra(); } };
  panel.querySelectorAll('[data-chplus]').forEach(el=> el.addEventListener('click', ()=> bump(el.dataset.chplus, 1)));
  panel.querySelectorAll('[data-chminus]').forEach(el=> el.addEventListener('click', ()=> bump(el.dataset.chminus, -1)));
  const yp = document.getElementById('yearPicker');
  if(yp) yp.addEventListener('change', ()=>{ extraYear = parseInt(yp.value,10); renderExtra(); });
}

/* ================= AUTORI (author checklists) ================= */
function normStr(x){ return String(x||'').trim().toLowerCase().replace(/\s+/g,' '); }
function newAuthorListId(){ return 'au-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function findLibraryBook(card, it){
  return books.find(b=> normStr(b.title)===normStr(it.title) && normStr(b.author)===normStr(card.name)) || null;
}
function authorItemDone(card, it){
  const lb = findLibraryBook(card, it);
  return lb ? lb.status==='read' : !!it.done;
}
function authorProgress(card){
  const total = card.items.length;
  const done = card.items.filter(it=>authorItemDone(card,it)).length;
  return { done, total };
}
function guessAuthorGenre(name){
  const counts = {};
  books.filter(b=>normStr(b.author)===normStr(name)).forEach(b=> counts[b.genre]=(counts[b.genre]||0)+1);
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  return top ? top[0] : 'Fantasy';
}
function renderAutori(){
  const panel = document.getElementById('panel-autori');
  const sorted = authorLists.slice().sort((a,b)=> a.name.localeCompare(b.name));
  let html = `<section class="block"><div class="block-head"><h2>Schede autori</h2><button class="btn-mark" id="btnNewAuthor" type="button">+ Nuova scheda</button></div>`;
  if(sorted.length===0){
    html += `<div class="empty-note">Nessuna scheda ancora. Crea la scheda di un'autrice o di un autore e inserisci la lista dei suoi libri: spunta quelli che hai letto e, se ne vuoi leggere uno, aggiungilo alla libreria con un tocco.</div>`;
  } else {
    html += `<div class="author-grid">`;
    sorted.forEach(card=>{
      const pr = authorProgress(card);
      const pct = pr.total ? pr.done/pr.total*100 : 0;
      html += `<div class="author-card" data-author="${card.id}">
        <div class="author-name">${escapeHtml(card.name)}</div>
        <div class="goal-track" style="margin:8px 0 6px;"><div class="goal-fill" style="width:${pct}%;"></div></div>
        <div class="author-meta"><b>${pr.done}</b> / ${pr.total} letti</div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</section>`;
  panel.innerHTML = html;
  document.getElementById('btnNewAuthor').addEventListener('click', async ()=>{
    const name = (prompt('Nome dell\'autrice/autore:')||'').trim();
    if(!name) return;
    const card = { id:newAuthorListId(), name, genre:guessAuthorGenre(name), items:[] };
    authorLists.push(card); await saveData(); renderAutori(); openAuthorModal(card.id);
  });
  panel.querySelectorAll('[data-author]').forEach(el=> el.addEventListener('click', ()=> openAuthorModal(el.dataset.author)));
}

      const title = t.trim(); if(!title) return;

      card.items.push({ id:newAuthorListId(), title, saga: rest.join(' - ').trim(), done:false });
    });
    await saveData(); refresh();
  });
  $('auGenre').addEventListener('change', async ()=>{ card.genre = $('auGenre').value; await saveData(); });
  $('auRename').addEventListener('click', async ()=>{
    const name = (prompt('Nuovo nome:', card.name)||'').trim();
    if(!name) return; card.name = name; await saveData(); refresh();
  });
  $('auDelete').addEventListener('click', async ()=>{
    if(!confirm('Eliminare la scheda di "'+card.name+'"? I libri già in libreria non vengono toccati.')) return;
    authorLists = authorLists.filter(c=>c.id!==card.id); await saveData(); closeModalAndAutori();
  });
  modal.querySelectorAll('[data-audone]').forEach(el=> el.addEventListener('change', async ()=>{
    const it = card.items.find(x=>x.id===el.dataset.audone); if(it){ it.done = el.checked; await saveData(); refresh(); }
  }));
  modal.querySelectorAll('[data-audel]').forEach(el=> el.addEventListener('click', async ()=>{
    card.items = card.items.filter(x=>x.id!==el.dataset.audel); await saveData(); refresh();
  }));
  modal.querySelectorAll('[data-auadd]').forEach(el=> el.addEventListener('click', async ()=>{
    const it = card.items.find(x=>x.id===el.dataset.auadd); if(!it) return;
    const b = mk(card.name, it.saga || 'Standalone', it.title, 'toread', card.genre || 'Fantasy');
    b.order = books.filter(x=>normStr(x.author)===normStr(card.name) && normStr(x.saga)===normStr(b.saga)).length + 1;
    books.push(b); await saveData(); refresh();
  }));
  document.getElementById('modalOverlay').classList.add('open');
}

let openQuoteBooks = new Set();

  const panel = document.getElementById('panel-citazioni');

  books.forEach(b=>{

      line.replace(/^["“”«»]+\s*/, '').replace(/\s*["“”«»]+$/, '')

  });
  groups.sort((a,b)=> a.book.author.localeCompare(b.book.author) || a.book.saga.localeCompare(b.book.saga) || a.book.order-b.book.order);

  const total = groups.reduce((s,g)=>s+g.quotes.length, 0);
  let html = `<section class="block"><div class="block-head"><h2>Citazioni</h2><span class="sub">${total} ${total===1?'citazione':'citazioni'} in ${groups.length} ${groups.length===1?'libro':'libri'}</span></div>`;

  if(groups.length===0){
    html += `<div class="empty-note">Non hai ancora salvato citazioni. Apri un libro letto e scrivine una nella sezione "Citazioni preferite" (una per riga).</div></section>`;

  html += `<div class="quote-toolbar"><button class="chip" id="btnQuotesOpenAll" type="button">Apri tutti</button><button class="chip" id="btnQuotesCloseAll" type="button">Chiudi tutti</button></div>`;
  html += `<div class="quote-accordion">`;
  groups.forEach(g=>{
    const b = g.book;
    const gs = genreStyle(b.genre);
    const cover = b.coverUrl || customCoverCache[b.customCoverId];
    const isOpen = openQuoteBooks.has(b.id);
    html += `<div class="qgroup ${isOpen?'open':''}" data-qgroup="${b.id}">
      <div class="qgroup-head" data-qtoggle="${b.id}">
        <div class="quote-cover" data-qcover="${b.id}" style="background:linear-gradient(155deg, ${gs.c1}, ${gs.c2});">${cover?`<img src="${cover}" loading="lazy">`:''}</div>
        <div class="qgroup-info">
          <div class="qgroup-title">${escapeHtml(b.title)}</div>
          <div class="qgroup-sub">${escapeHtml(b.author)} · ${g.quotes.length} ${g.quotes.length===1?'citazione':'citazioni'}</div>
        </div>
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="qgroup-body">
        ${g.quotes.map(q=>`<div class="quote-line-item">“${escapeHtml(q)}”</div>`).join('')}
        <button class="btn-mark qgroup-open-book" data-open="${b.id}" type="button">Apri libro</button>
      </div>
    </div>`;
  });
  html += `</div></section>`;

  panel.innerHTML = html;
  wireCommon(panel);

  panel.querySelectorAll('[data-qtoggle]').forEach(el=> el.addEventListener('click', ()=>{
    const id = el.dataset.qtoggle;
    const group = panel.querySelector(`[data-qgroup="${id}"]`);
    if(openQuoteBooks.has(id)){ openQuoteBooks.delete(id); group.classList.remove('open'); }
    else { openQuoteBooks.add(id); group.classList.add('open'); }
  }));
  document.getElementById('btnQuotesOpenAll').addEventListener('click', ()=>{
    groups.forEach(g=> openQuoteBooks.add(g.book.id));
    panel.querySelectorAll('.qgroup').forEach(el=>el.classList.add('open'));
  });
  document.getElementById('btnQuotesCloseAll').addEventListener('click', ()=>{
    openQuoteBooks.clear();
    panel.querySelectorAll('.qgroup').forEach(el=>el.classList.remove('open'));
  });

  // covers uploaded by hand live in a separate store: load the missing ones and fill them in
  groups.forEach(g=>{
    const b = g.book;
    if(!b.coverUrl && b.customCoverId && !customCoverCache[b.customCoverId]){
      fetchCustomCover(b.customCoverId).then(data=>{
        if(!data) return;
        document.querySelectorAll(`[data-qcover="${b.id}"]`).forEach(el=>{ el.innerHTML = `<img src="${data}" loading="lazy">`; });
      });
    }
  });
}

/* ================= "COSA LEGGO STASERA?" ================= */
function pickRandomBook(){
  let pool = books.filter(b=>b.status==='toread' && !b.upcoming);
  if(pool.length===0) pool = books.filter(b=>b.status!=='read');
  if(pool.length===0) return null;
  // slightly favor books that continue an already-started saga
  const weighted = pool.map(b=>{
    const sagaMates = books.filter(x=>x.author===b.author && x.saga===b.saga);
    const startedBonus = sagaMates.some(x=>x.status==='read') ? 2 : 1;
    return {b, weight: startedBonus};
  });
  const total = weighted.reduce((s,w)=>s+w.weight, 0);
  let r = Math.random()*total;
  for(const w of weighted){ r -= w.weight; if(r<=0) return w.b; }
  return pool[0];
}

    const existing = books.filter(b=>b.author===author && b.saga===saga);
    const order = existing.length ? Math.max(...existing.map(b=>b.order))+1 : 1;
    const nb = mk(author, saga, title, nStatus, nGenre, date ? {upcoming:true, releaseDate:date} : {});
    nb.order = order;
    books.push(nb);
    setSaveStatus('saving');
    await saveData();
    closeModal();
    activeTab='libreria'; render();
    fetchCoverFor(nb).then(async ()=>{ patchCoverInDom(nb); setSaveStatus('saving'); await saveData(); });
  });
  document.getElementById('modalOverlay').classList.add('open');
}
document.getElementById('fabAdd').addEventListener('click', openAddModal);

/* ================= INIT ================= */
async function boot(){
  try{ await loadData(); }
  catch(e){ return; } // error screen already shown by loadData
  await migrateDuplicateIds();
  await migrateInlineCovers();
  await migrateReviewFields();
  await migrateCoverSizes();
  await migratePlans();
  await migrateReleased();
  render();
  runCoverQueue();
  // Actively remove any previously-installed service worker and its caches —
  // it was causing stale versions of the app to silently overwrite newer data.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
  }
  if(window.caches){
    caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(()=>{});
  }
}
(function start(){
  const saved = getSavedConfig();
  if(saved){
    try{ initFirebase(saved.config, saved.code); boot(); }
    catch(e){ renderSetupScreen('Errore di connessione: ' + e.message); }
  } else {
    renderSetupScreen();
  }
})();

</script>
